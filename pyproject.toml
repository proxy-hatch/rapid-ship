[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rapid-ship"
version = "0.2.0"
description = "Local tools for building software with coding agents and GitHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tomli-w>=1.2,<2",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=50,<51",
]

[project.urls]
Repository = "https://github.com/proxy-hatch/rapid-ship"
Issues = "https://github.com/proxy-hatch/rapid-ship/issues"

[project.scripts]
rapid-ship = "rapid_ship.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6.0.3,<7",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.15,<3",
    "pyjwt[crypto]>=2.10,<3",
    "vulture>=2.16,<3",
    "deptry>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["rapid_ship"]

# Build tools may resolve Git ignore rules from the primary checkout of a worktree.
# Explicitly keep generated docs out of source archives; .gitignore keeps out the
# state left by the removed controller.
[tool.hatch.build.targets.sdist]
# Hatch follows directory symlinks and visits each inode once. Skip checkout skill
# aliases before traversal so their canonical package resources remain in the package.
skip-excluded-dirs = true
exclude = [
    "/.agents/skills", "/.claude/skills",
    "/website/node_modules", "/website/build", "/website/.docusaurus",
]

[tool.ruff]
target-version = "py312"
# this repository: lines are capped at 100 characters
line-length = 100
# this repository: devctl and its test helper are first-party for import sorting
src = [".", "tools/devctl", "tests/devctl"]
# this repository: templates are byte-identical to tools/devctl, which is linted; `vendored` enforces it
extend-exclude = ["rapid_ship/templates"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PGH", "ERA", "T20", "S", "TID",
    "PT", "PTH", "DTZ", "C90", "TD", "BLE", "ANN401",
]
external = ["V"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# this repository: the vendored devctl is checked here, its template copy is excluded,
# and devctl replaces the seed's mypy_path "src"
files = ["rapid_ship", "tools/devctl", "tests"]
exclude = ["^rapid_ship/templates/"]
mypy_path = "tools/devctl"

[tool.pytest.ini_options]
testpaths = ["tests"]
# this repository: devctl tests import the vendored devctl and their shared workspace helper
pythonpath = ["tools/devctl", "tests/devctl"]
# this repository: "-ra" before the seed's two options
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["rapid_ship"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "rapid-ship CLI layers"
type = "layers"
layers = ["rapid_ship.cli", "rapid_ship.kit", "rapid_ship.files"]

[[tool.importlinter.contracts]]
name = "rapid-ship app: the command and the key import, then the manifest flow, then the Keychain"
type = "layers"
layers = [
    "rapid_ship.cli",
    "rapid_ship.github_app | rapid_ship.app_import",
    "rapid_ship.app_flow",
    "rapid_ship.app_keychain",
]

[[tool.importlinter.contracts]]
name = "rapid-ship never imports the vendored devctl"
type = "forbidden"
source_modules = ["rapid_ship"]
forbidden_modules = ["devctl", "devctl_project"]

[tool.vulture]
# this repository: the vendored devctl is read here, not its template copy, the seeds or
# the virtual environment in tools/devctl/.venv, which vulture would otherwise walk
paths = ["rapid_ship", "scripts", "tests", "tools/devctl/devctl", "tools/devctl/devctl_project"]
exclude = ["rapid_ship/templates/"]
# this repository: names that the standard library or pytest reaches in several files, by name
ignore_names = [
    "do_[A-Z]*",  # rs-exception: EX-26
    "log_message",  # rs-exception: EX-27
    "pytestmark",  # rs-exception: EX-29
]

[tool.deptry]
# this repository: the templates and the vendored devctl, whose imports are devctl's own
extend_exclude = ["rapid_ship/templates", "tools/devctl"]
