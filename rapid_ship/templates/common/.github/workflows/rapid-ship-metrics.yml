# Managed by rapid-ship. Change the template in rapid-ship, then run `rapid-ship sync`.
name: rapid-ship metrics

on:
  schedule:
    - cron: "41 5 * * *"   # daily at 05:41 UTC; GitHub runs it on the default branch
  workflow_dispatch:

permissions: {}

concurrency:
  group: rapid-ship-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: rapid-ship metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read        # checkout, and the git history that devctl reads
      pull-requests: read   # merged and closed pull requests, and their reviews
      actions: read         # the check workflow's runs, for Red merges
      deployments: read     # deployments, for a project's deployments metric
      issues: write         # the report issue and its comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Post the metrics report
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./devctl metrics --post
