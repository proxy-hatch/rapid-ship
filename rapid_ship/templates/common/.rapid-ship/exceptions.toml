# Each suppression carries `rs-exception: EX-<n>` on its line.
# Each entry names the path, the rule, a reason and when to remove it. Changes need the owner.
# Every key is required and holds non-empty text.
#
# [[exception]]
# id = "EX-1"                # EX-<n>, n from 1, each ID once
# path = "src/app/run.py"    # from the repository root
# rule = "S603"              # or "file-size" for a file over the cap
# reason = "Runs the project's own build tool with fixed arguments"
# remove_when = "The build tool has a Python API"
