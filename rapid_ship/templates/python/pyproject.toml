# Guardrail settings from rapid-ship. Changes need the owner (Protected set).
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "{{project_name}}"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [                # the check tools that devctl runs
    "deptry>=0.25,<1",
    "import-linter>=2.15,<3",
    "mypy>=1.20,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<1",
    "vulture>=2.16,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/{{package}}"]

[tool.ruff]
target-version = "py312"
# rapid-ship checks its own Kit code upstream.
extend-exclude = ["tools/devctl"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PGH", "ERA", "T20", "S",
    "TID", "PT", "PTH", "DTZ", "C90", "TD", "BLE", "ANN401",
]
# Codes of other tools that a noqa comment may name, kept instead of reported as RUF102:
# vulture's. Rule codes or prefixes; Ruff's default is none.
external = ["V"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest asserts
"src/{{package}}/settings.py" = ["TID251"]  # the one module that reads the environment

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Patterns add entries here, one per banned member.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "read configuration through {{package}}.settings; see docs/patterns/python-configuration.md"
"os.getenv".msg = "read configuration through {{package}}.settings; see docs/patterns/python-configuration.md"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# strict leaves these error codes off.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["{{package}}"]
include_external_packages = true   # the forbidden contract names pytest, an installed package

[[tool.importlinter.contracts]]
# Layers are listed top first; no layer imports a layer above it.
name = "Layers"
type = "layers"
containers = ["{{package}}"]
# Optional layers, in parentheses, until Plan names the real ones.
layers = ["(entrypoints)", "(services)", "(domain)"]

[[tool.importlinter.contracts]]
name = "Production code never imports the test framework"
type = "forbidden"
source_modules = ["{{package}}"]
forbidden_modules = ["pytest"]

[tool.vulture]
# Unused code: devctl's dead-code step runs vulture, and each finding fails the step. A false
# positive gets `# noqa: V<code>` and its rs-exception marker on the reported line.
# paths: the files and directories vulture scans, tests included, so a use in a test counts.
# vulture's default is none, and it then stops with "Please pass at least one file or directory".
paths = ["src", "tests"]

[tool.deptry]
# Dependencies that do not match the imports: devctl's dead-code step runs `deptry .` with every
# rule on, and each finding fails the step. A false positive on an import gets
# `# deptry: ignore[<code>]` and its rs-exception marker on the import's line.
# extend_exclude: regular expressions, each matched from the start of a path relative to this
# directory, added to deptry's default exclude (venv, .venv, .direnv, tests, .git and setup.py)
# and to .gitignore's entries. Default: none. devctl's imports are not the project's.
extend_exclude = ["tools/devctl"]
# known_first_party: module names that deptry counts as this project's own, besides the modules
# directly in this directory. Default: none. The package sits under src/.
known_first_party = ["{{package}}"]
