# rapid-ship Kit manifest. Paths are relative to common/ or a stack directory, before substitution.
# Every template not listed under seeded or new_project is managed.
seeded = [
    ".agents/hooks.json",
    ".claude/settings.json",
    ".github/CODEOWNERS",
    ".rapid-ship/exceptions.toml",
    ".rapid-ship/project.toml",
    "AGENTS.md",
    "ARCHITECTURE.md",
    "CLAUDE.md",
    "README.md",
    "docs/AGENTS.md",
    "docs/features/README.md",
    "docs/patterns/README.md",
    "tools/AGENTS.md",
    "tools/devctl/devctl_project/__init__.py",
]

executable = ["devctl", ".agents/devctl", ".githooks/pre-commit", "tools/devctl/devctl/github/askpass.py"]
optional_skills = []
variables = ["code_owner", "owner", "package", "project_name", "repository", "directory", "guide_rows", "lint_marker", "source_roots", "stack_patterns", "stack_protected", "stack_rows", "stack_rules", "stack_tables", "stack_title", "unit_tests"]

[new_project]
python = [
    ".gitignore",
    "__root__/docs/patterns/python-configuration.md",
    "__root__/docs/patterns/python-error-handling.md",
    "__root__/docs/patterns/python-input-validation.md",
    "__root__/docs/patterns/python-performance.md",
    "pyproject.toml",
    "src/AGENTS.md",
    "src/__package__/__init__.py",
    "src/__package__/errors.py",
    "src/__package__/inputs.py",
    "src/__package__/profiling.py",
    "src/__package__/settings.py",
    "tests/AGENTS.md",
    "tests/test_errors.py",
    "tests/test_import.py",
    "tests/test_inputs.py",
    "tests/test_profiling.py",
    "tests/test_settings.py",
]
