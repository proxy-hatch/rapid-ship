# Each suppression carries `rs-exception: EX-<n>` on its line.
# Each entry names the path, the rule, a reason and when to remove it. Changes need the owner.
# Every key is required and holds non-empty text.
#
# [[exception]]
# id = "EX-1"                # EX-<n>, n from 1, each ID once
# path = "src/app/run.py"    # from the repository root
# rule = "S603"              # or "file-size" for a file over the cap
# reason = "Runs the project's own build tool with fixed arguments"
# remove_when = "The build tool has a Python API"

[[exception]]
id = "EX-1"
path = "rapid_ship/templates/common/tools/devctl/devctl/process.py"
rule = "S603"
reason = "The one place devctl starts a process; argv is a list and no shell runs"
remove_when = "Ruff stops reporting S603 for list arguments without a shell"

[[exception]]
id = "EX-3"
path = "rapid_ship/templates/common/tools/devctl/devctl/repo.py"
rule = "S603,S607"
reason = "Runs git with fixed arguments and keeps raw bytes for paths that are not UTF-8"
remove_when = "repo.py runs git through process.run_process"

[[exception]]
id = "EX-2"
path = "rapid_ship/templates/common/tools/devctl/devctl/check/__init__.py"
rule = "BLE001"
reason = "An unexpected error while building the step list or running a step must report it as blocked, never crash the run as a failure"
remove_when = "Every step catches its own errors and building the step list cannot raise"

[[exception]]
id = "EX-4"
path = "rapid_ship/kit/git.py"
rule = "S603"
reason = "rapid_ship must not import devctl's process runner, so git() starts git itself; argv is a list and no shell runs"
remove_when = "rapid_ship has a process runner of its own that the Kit commands share"

[[exception]]
id = "EX-7"
path = "rapid_ship/kit/pull_request.py"
rule = "S603"
reason = "Runs gh pr create with an argv list and the body on stdin; no shell runs"
remove_when = "rapid_ship has a process runner of its own that the Kit commands share"

[[exception]]
id = "EX-8"
path = "scripts/smoke_distribution.py"
rule = "S603"
reason = "The distribution smoke uses only the standard library, so run() starts each command itself; argv is a tuple and no shell runs"
remove_when = "The smoke may import a process runner from the installed package"

[[exception]]
id = "EX-9"
path = "tests/test_kit_cli.py"
rule = "skipif"
reason = "Root can read a file with mode 000, so the unreadable-file case cannot happen when the tests run as root"
remove_when = "The test makes a file unreadable in a way that also stops root, or the tests never run as root"

[[exception]]
id = "EX-10"
path = "tests/test_kit_init_existing_checks.py"
rule = "skipif"
reason = "Root can read a directory with mode 000, so the unreadable hooks directory cannot happen when the tests run as root"
remove_when = "The test makes the directory unreadable in a way that also stops root, or the tests never run as root"

[[exception]]
id = "EX-11"
path = "rapid_ship/app_keychain.py"
rule = "S603"
reason = "rapid-ship app runs security and gh with fixed arguments and no shell; rapid_ship may not import devctl's runner"
remove_when = "Ruff stops reporting S603 for list arguments without a shell"

[[exception]]
id = "EX-12"
path = "rapid_ship/templates/common/tools/devctl/devctl/merge_guard.py"
rule = "BLE001"
reason = "Once the merge guard has recognised a merge, any error while it checks must deny that merge, never let it through"
remove_when = "The guard's reads and parsers raise only OwnerReadError, GitHubError and ValueError, so a narrow except covers them"

[[exception]]
id = "EX-13"
path = "rapid_ship/app_flow.py"
rule = "V107"
reason = "socketserver reads daemon_threads on the flow server's class, so each request thread is a daemon; no code here reads it"
remove_when = "The flow server no longer sets daemon_threads"

[[exception]]
id = "EX-14"
path = "rapid_ship/app_flow.py"
rule = "V105,V107"
reason = "socketserver calls handle_error by name, with client_address; the override keeps the base class's signature and stays silent"
remove_when = "The flow server no longer overrides handle_error"

[[exception]]
id = "EX-15"
path = "rapid_ship/cli.py"
rule = "V107"
reason = "argparse calls Action.__call__ with namespace; the version action keeps that signature and does not read it"
remove_when = "The version action reads namespace, or argparse's own version action replaces it"

[[exception]]
id = "EX-16"
path = "rapid_ship/cli.py"
rule = "V107"
reason = "argparse calls Action.__call__ with option_string; the version action keeps that signature and does not read it"
remove_when = "The version action reads option_string, or argparse's own version action replaces it"

[[exception]]
id = "EX-17"
path = "rapid_ship/templates/common/tools/devctl/devctl/command_line.py"
rule = "V101"
reason = "shlex.shlex reads whitespace_split while it splits a command line; no code here reads it"
remove_when = "_words no longer sets whitespace_split, or vulture counts an attribute that a library reads as used"

[[exception]]
id = "EX-18"
path = "rapid_ship/templates/common/tools/devctl/devctl/command_line.py"
rule = "V101"
reason = "shlex.shlex reads commenters while it splits a command line; no code here reads it"
remove_when = "_words no longer sets commenters, or vulture counts an attribute that a library reads as used"

[[exception]]
id = "EX-19"
path = "tests/devctl/github_fixtures.py"
rule = "V103"
reason = "pytest calls the isolated_home fixture by name for each fixture that requests it"
remove_when = "No fixture requests isolated_home"

[[exception]]
id = "EX-20"
path = "tests/devctl/github_fixtures.py"
rule = "V107"
reason = "remote requests isolated_home for its effect, HOME in tmp_path, and a fixture cannot use pytest.mark.usefixtures"
remove_when = "remote reads its isolated_home value, or no longer needs it"

[[exception]]
id = "EX-21"
path = "tests/devctl/github_fixtures.py"
rule = "V107"
reason = "ctx requests isolated_home for its effect, HOME in tmp_path, and a fixture cannot use pytest.mark.usefixtures"
remove_when = "ctx reads its isolated_home value, or no longer needs it"

[[exception]]
id = "EX-22"
path = "tests/devctl/github_fixtures.py"
rule = "V107"
reason = "ctx_github requests isolated_home for its effect, HOME in tmp_path, and a fixture cannot use pytest.mark.usefixtures"
remove_when = "ctx_github reads its isolated_home value, or no longer needs it"

[[exception]]
id = "EX-23"
path = "tests/test_kit_app_import.py"
rule = "V107"
reason = "Terminal.read keeps BytesIO.read's signature, which mypy checks, and fails the test without reading size"
remove_when = "Terminal no longer overrides read"

[[exception]]
id = "EX-24"
path = "tests/test_kit_cli.py"
rule = "V103"
reason = "pytest calls the no_package_metadata fixture by name, from the usefixtures marks of two tests"
remove_when = "No test uses no_package_metadata"

[[exception]]
id = "EX-25"
path = "tests/test_kit_init_existing_checks.py"
rule = "V103"
reason = "pytest calls the autouse default_hooks_directory fixture by name for each test in the module"
remove_when = "The module's tests no longer need git's default hooks directory"

[[exception]]
id = "EX-26"
path = "pyproject.toml"
rule = "vulture.ignore_names:do_[A-Z]*"
reason = "BaseHTTPRequestHandler calls do_<METHOD> by name, in rapid_ship/app_flow.py and the HTTP fakes in tests/devctl/github_fakes.py and tests/test_kit_app.py"
remove_when = "No module here subclasses BaseHTTPRequestHandler"

[[exception]]
id = "EX-27"
path = "pyproject.toml"
rule = "vulture.ignore_names:log_message"
reason = "BaseHTTPRequestHandler calls log_message, which the same three handlers override to stay silent"
remove_when = "No module here overrides BaseHTTPRequestHandler.log_message"

[[exception]]
id = "EX-28"
path = "tests/conftest.py"
rule = "V107"
reason = "pytest reads pytest_plugins by name"
remove_when = "tests/conftest.py loads no plugin module"

[[exception]]
id = "EX-29"
path = "pyproject.toml"
rule = "vulture.ignore_names:pytestmark"
reason = "pytest reads pytestmark from a test module by name; three devctl test modules set it"
remove_when = "No test module sets pytestmark"

[[exception]]
id = "EX-30"
path = "rapid_ship/templates/common/tools/devctl/devctl/hook.py"
rule = "BLE001"
reason = "agy documents a hook's answer only as JSON on stdout, so any error of devctl hook's own must become that answer, a deny that names the error, rather than an exit 1 or a traceback"
remove_when = "agy documents how it treats a hook that exits 1, or the hook's code can raise only errors that a narrow except names"
