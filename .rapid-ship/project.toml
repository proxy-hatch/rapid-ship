# rapid-ship project settings. No secrets. Changes need the owner (Protected set).
stack = "python"     # python or agnostic

[github]
# The GitHub repository, written "owner/name".
repository = "proxy-hatch/rapid-ship"
# The code owner that CODEOWNERS names, written as CODEOWNERS writes it: "@login" or "@organisation/team".
code_owner = "@proxy-hatch"
# Agent identity: each App's ID and slug, as rapid-ship app prints them. 0 and "" mean off.
# Record both Apps or neither.
worker_app_id = 5376519
worker_app_slug = "proxy-hatch-rs-worker"
reviewer_app_id = 5376520
reviewer_app_slug = "proxy-hatch-rs-reviewer"

[escalation]
# The Mode. true is Walk: the owner merges every pull request. false is Flight.
every_pr = true

[kit]
optional = []          # opt-in Kit skills; none in this Kit version
exclude = []           # Kit files or directories the project owns instead

[map]
# Source directories: each child directory needs a guide, and file-size caps their source files at 500 lines.
source_roots = ["rapid_ship"]
unguided = []
# Directories whose AGENTS.md files are template content. Here the template trees hold the
# AGENTS.md files of future projects, not guides of this one.
exclude = ["rapid_ship/templates/common", "rapid_ship/templates/python", "rapid_ship/templates/agnostic"]

[tests]
unit = ["tests/unit/**"]   # every other test counts as behavioural
